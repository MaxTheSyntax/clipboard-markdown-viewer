version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - node scripts/generate-config.mjs
  artifacts:
    baseDirectory: .
    files:
      - index.html
      - config.js
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
